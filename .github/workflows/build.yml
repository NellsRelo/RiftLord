# Draft (decision 3): native builds once the repository is on GitHub. Not yet run.
# The release check and the build comparisons need the game installed, so CI only builds;
# the gate (tools/gate.py) stays a local step.
name: build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      # bpkit is shared with other mods and lives in its own repository (vars.BPKIT_REPOSITORY)
      RIFTLORD_BPKIT: ${{ github.workspace }}/bpkit-src/bpkit
      RIFTLORD_BUILD_OUT: ${{ github.workspace }}/build-out
    steps:
      - uses: actions/checkout@v4
        with:
          path: RiftLordEditor
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.BPKIT_REPOSITORY }}
          path: bpkit-src
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Linux libraries for the window
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev
      - name: Python packages
        working-directory: RiftLordEditor
        run: python -m pip install -r requirements-build.txt
      - name: Build
        working-directory: RiftLordEditor
        run: python tools/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: RiftLord-${{ runner.os }}
          path: |
            RiftLordEditor/dist/RiftLord*
